[project]
name = "pawlaris-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "uvicorn",
  "sqlalchemy[asyncio]>=2,<3",
  "asyncpg",
  "alembic",
  "pyjwt",
  "argon2-cffi",
  "pillow",
  "tzdata",
  "httpx",
  "websockets",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "pytest-cov"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
data_file = ".cache/coverage"
concurrency = ["greenlet", "thread"]
