# services/api is Python (uv), not a pnpm workspace.
packages:
  - 'apps/*'
  - 'packages/*'
# Keep native CMake and prefab paths below Windows tool limits (Q-4).
virtualStoreDir: .p
virtualStoreDirMaxLength: 20
allowBuilds:
  # The resolver ships prebuilt binaries; no install-time script is needed.
  unrs-resolver: false
overrides:
  # Align automatically installed peers with Expo SDK 57 and React 19.2.
  '@react-native/metro-config': 0.86.3
  react-dom: 19.2.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-reconciler: 0.33.0
